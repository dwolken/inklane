name: Windows build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/package.ps1 -VerifyInstaller
      - name: Retain checked Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Inklane-win-x64-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/Inklane-Setup-*-x64.exe
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed-check diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Inklane-check-diagnostics-${{ github.sha }}
          path: |
            .scratch/test-runs/**/*.png
            .scratch/package/startup-*.json
            .scratch/installer-validation/**/checks.log
            .scratch/installer-validation/**/installed-startup.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download the validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Inklane-win-x64-${{ github.sha }}
          path: artifacts
      - name: Publish private prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $private = & gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private.Trim() -ne 'true') {
            throw 'Release publication requires the verified private repository.'
          }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.]+)?$') {
            throw 'The release tag is not a supported version.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "artifacts/Inklane-$version-win-x64.zip"
          $setup = "artifacts/Inklane-Setup-$version-x64.exe"
          $assets = @($setup, "$setup.sha256", $archive, "$archive.sha256")
          foreach ($path in ($assets + 'docs/release-notes.md')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required release file is missing: $path" }
          }
          foreach ($asset in @($setup, $archive)) {
            $expected = ((Get-Content -LiteralPath "$asset.sha256" -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Downloaded asset failed its SHA-256 check: $asset" }
          }
          & gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --prerelease --title "Inklane $version" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Private prerelease publication failed.' }
