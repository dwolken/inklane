name: Product website

on:
  push:
    branches: [main]
    paths: ['website/**', 'brand/motion/**', 'brand/type/**', '.github/workflows/pages.yml', 'docs/screenshots/**', 'src/Inklane/Assets/**']
  pull_request:
    paths: ['website/**', 'brand/motion/**', 'brand/type/**', '.github/workflows/pages.yml', 'docs/screenshots/**', 'src/Inklane/Assets/**']
  # A release published with GITHUB_TOKEN does not trigger another release event.
  # Completing a tagged Windows build refreshes the download from trusted main.
  workflow_run:
    workflows: ['Windows build and package']
    types: [completed]
  workflow_dispatch:

permissions: {}

# Superseded pull-request builds do not need a second browser runner. Main
# deployments and release-triggered refreshes keep their own run and artifact.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      editor_digest: ${{ steps.verify.outputs.editor_digest }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install locked browser dependencies
        run: npm ci --prefix website --ignore-scripts --no-audit
      - name: Check release download verification
        run: python3 website/test_build.py
      - name: Build static site from the published installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 website/build.py --output .scratch/pages/inklane
      - name: Verify desktop and mobile journeys in Chrome
        id: verify
        run: |
          node website/test.mjs .scratch/pages/inklane
          node website/test-editor.mjs .scratch/pages/inklane
          INKLANE_INSTALL_CHECK=1 xvfb-run -a node website/test-platform.mjs .scratch/pages/inklane
          echo "digest=$(sha256sum .scratch/pages/inklane/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "editor_digest=$(sha256sum .scratch/pages/inklane/editor/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Package the tested site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          # A retried build must not leave two indistinguishable deployment artifacts.
          name: github-pages-${{ github.run_attempt }}
          path: .scratch/pages/inklane

  apple-browser:
    needs: build
    # Exercise Intel WebKit as well as the Apple Silicon native workspace jobs.
    runs-on: macos-15-intel
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build the standalone workspace
        run: |
          npm ci --prefix website --ignore-scripts --no-audit
          python3 website/build.py --workspace-only --output .scratch/pages/inklane
      - name: Exercise PDF import and offline reopening in WebKit
        env:
          INKLANE_ENGINE: webkit
        run: |
          website/node_modules/.bin/playwright-core install webkit
          node website/test-platform.mjs .scratch/pages/inklane

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, apple-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Verify the public HTML matches the tested build
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.digest }}
          EDITOR_SHA256: ${{ needs.build.outputs.editor_digest }}
        run: |
          for attempt in {1..12}; do
            if curl --silent --show-error --fail --max-time 15 "https://dwolken.github.io/inklane/?build=$GITHUB_RUN_ID" --output "$RUNNER_TEMP/inklane.html" &&
              echo "$EXPECTED_SHA256  $RUNNER_TEMP/inklane.html" | sha256sum --check --status &&
              curl --silent --show-error --fail --max-time 15 "https://dwolken.github.io/inklane/editor/?build=$GITHUB_RUN_ID" --output "$RUNNER_TEMP/editor.html" &&
              echo "$EDITOR_SHA256  $RUNNER_TEMP/editor.html" | sha256sum --check --status; then
              exit 0
            fi
            sleep 5
          done
          echo 'The public site or editor did not serve the tested HTML.' >&2
          exit 1
