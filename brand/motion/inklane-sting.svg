<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Inklane</title>
  <desc id="desc">A note opens beside its anchor on a drawing. Its lines fold into the Inklane mark and the name appears.</desc>
  <style>
    .word { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-size: 136px; font-weight: 650; letter-spacing: -6px; fill: #242234 }
    #still { display: none }
    @media (prefers-reduced-motion: reduce) { #motion { display: none } #still { display: inline } }
  </style>
  <defs>
    <linearGradient id="folio" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#36315D"/><stop offset="1" stop-color="#211F39"/>
    </linearGradient>
    <!-- The five final contours come from the desktop identity, in its 48-unit coordinate space. -->
    <path id="sheet" d="M11 3h19q1.2 0 2.1.9l9 9q.9.9.9 2.1v23a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6Z"/>
    <path id="corner" d="M30 3q1.2 0 2.1.9l9 9q.9.9.9 2.1h-7a5 5 0 0 1-5-5Z"/>
    <path id="margin" d="M12 12h7v17l-7 7Z"/>
    <path id="lane" d="m12 36 13-13h10v7h-7l-6 6Z"/>
    <path id="crease" d="m12 36 7-7v7Z"/>
    <g id="mark">
      <use xlink:href="#sheet" fill="url(#folio)" stroke="#5D5681" stroke-width=".7"/>
      <use xlink:href="#corner" fill="#8075C1"/>
      <use xlink:href="#margin" fill="#E1DBFF"/>
      <use xlink:href="#lane" fill="#B3A1FF"/>
      <use xlink:href="#crease" fill="#8577C8"/>
    </g>
    <text id="name" class="word" x="0" y="585">Inklane</text>
    <clipPath id="name-window"><rect x="0" y="400" width="0" height="245">
      <animate attributeName="width" from="0" to="550" begin="2.48s" dur=".74s" calcMode="spline" keySplines=".4 0 .16 1" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#faf9f6"/>
  <g id="motion">
    <!-- A detail of a measured drawing. The pin sits directly on the sill. -->
    <g transform="translate(960 540) scale(4.2) translate(-24 -24)" fill="none" stroke-linejoin="round">
      <g opacity="0">
        <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.22;.63;1" dur="1.71s" fill="freeze"/>
        <path d="M-116 38h42V9l14-10h17v39h38" stroke="#a9a4ad" stroke-width=".6"/>
        <path d="M-116 40h45V10l12-8h13v38h41" stroke="#c5c0c6" stroke-width=".45"/>
        <path d="M-98 45h65m-65-1.5v3m65-3v3" stroke="#d1cbd0" stroke-width=".5"/>
      </g>
      <path d="M-43 38h9l9-9h6" stroke="#9c885f" stroke-width=".6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;.27;.74;1" begin=".15s" dur="1.49s" fill="freeze"/>
      </path>
      <g transform="translate(-43 38)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.8;1" dur="1.6s" fill="freeze"/>
          <g>
            <animateTransform attributeName="transform" type="scale" values=".35;1.05;1" keyTimes="0;.7;1" dur=".34s" fill="freeze"/>
            <rect x="-5.6" y="-5.6" width="11.2" height="11.2" rx="3.4" fill="#ffdb94" stroke="#b99047" stroke-width=".3"/>
            <path d="m-1.45-1.25 1.8-1.25v5" stroke="#513b21" stroke-width=".78" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(837 0)" clip-path="url(#name-window)">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.48s" dur=".26s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 7" to="0 0"
                          begin="2.42s" dur=".73s" calcMode="spline" keySplines=".24 .75 .20 1" fill="freeze"/>
        <use xlink:href="#name"/>
      </g>
    </g>

    <!-- Keep the left edge of the expanding card attached to its leader.
         The last four Bézier paths match the corresponding closed mark contours. -->
    <g transform="translate(960 540)">
      <animateTransform attributeName="transform" type="translate" from="960 540" to="737 540"
                        begin="2.00s" dur=".87s" calcMode="spline" keySplines=".42 0 .16 1" fill="freeze"/>
      <g transform="scale(4.2) translate(-24 -24)">
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin=".24s" dur=".18s" fill="freeze"/>
          <path fill="url(#folio)" stroke="#5D5681" stroke-width=".7"
                d="M11 3 L30 3 Q31.2 3 32.1 3.9 L41.1 12.9 Q42 13.8 42 15 L42 38 A6 6 0 0 1 36 44 L11 44 A6 6 0 0 1 5 38 L5 9 A6 6 0 0 1 11 3 Z">
            <animate attributeName="d" begin=".24s" dur="1.97s" fill="freeze" calcMode="spline"
                     keyTimes="0;.26;.52;1" keySplines=".2 .75 .19 1;0 0 1 1;.50 0 .20 1"
                     values="M-18 26 L-15 26 Q-14.6 26 -14 26.5 L-13 27.5 Q-12.6 28 -12.6 28.4 L-12.6 30 A1 1 0 0 1 -13.6 31 L-18 31 A1 1 0 0 1 -19 30 L-19 27 A1 1 0 0 1 -18 26 Z;
                             M-15 5 L62 5 Q63.2 5 64.1 5.9 L72.1 13.9 Q73 14.8 73 16 L73 39 A4 4 0 0 1 69 43 L-15 43 A4 4 0 0 1 -19 39 L-19 9 A4 4 0 0 1 -15 5 Z;
                             M-15 5 L62 5 Q63.2 5 64.1 5.9 L72.1 13.9 Q73 14.8 73 16 L73 39 A4 4 0 0 1 69 43 L-15 43 A4 4 0 0 1 -19 39 L-19 9 A4 4 0 0 1 -15 5 Z;
                             M11 3 L30 3 Q31.2 3 32.1 3.9 L41.1 12.9 Q42 13.8 42 15 L42 38 A6 6 0 0 1 36 44 L11 44 A6 6 0 0 1 5 38 L5 9 A6 6 0 0 1 11 3 Z"/>
          </path>
          <path fill="#8075C1" d="M30 3 Q31.2 3 32.1 3.9 L41.1 12.9 Q42 13.8 42 15 L35 15 A5 5 0 0 1 30 10 Z">
            <animate attributeName="d" begin=".24s" dur="1.97s" fill="freeze" calcMode="spline"
                     keyTimes="0;.26;.52;1" keySplines=".2 .75 .19 1;0 0 1 1;.50 0 .20 1"
                     values="M-15 26 Q-14.6 26 -14 26.5 L-13 27.5 Q-12.6 28 -12.6 28.4 L-14 28.4 A1 1 0 0 1 -15 27.4 Z;
                             M62 5 Q63.2 5 64.1 5.9 L72.1 13.9 Q73 14.8 73 16 L66 16 A4 4 0 0 1 62 12 Z;
                             M62 5 Q63.2 5 64.1 5.9 L72.1 13.9 Q73 14.8 73 16 L66 16 A4 4 0 0 1 62 12 Z;
                             M30 3 Q31.2 3 32.1 3.9 L41.1 12.9 Q42 13.8 42 15 L35 15 A5 5 0 0 1 30 10 Z"/>
          </path>
        </g>
        <!-- The heading draws from the margin. The two reading lines tuck into the folded lane. -->
        <path fill="#E1DBFF" d="M-11 17 L-11 14 L-11 14 L-11 17 Z">
          <animate attributeName="d" begin=".51s" dur="1.58s" fill="freeze" calcMode="spline"
                   keyTimes="0;.17;.46;1" keySplines=".22 .72 .2 1;0 0 1 1;.50 0 .18 1"
                   values="M-11 17 L-11 14 L-11 14 L-11 17 Z; M-11 17 L-11 14 L18 14 L18 17 Z;
                           M-11 17 L-11 14 L18 14 L18 17 Z;M12 12 L19 12 L19 29 L12 36 Z"/>
        </path>
        <path fill="#B3A1FF" d="M-11 24 L-11 24 L-11 24 L-11 25.4 L-11 25.4 L-11 25.4 Z">
          <animate attributeName="d" begin=".59s" dur="1.61s" fill="freeze" calcMode="spline"
                   keyTimes="0;.23;.47;1" keySplines=".22 .72 .2 1;0 0 1 1;.50 0 .18 1"
                   values="M-11 24 L-11 24 L-11 24 L-11 25.4 L-11 25.4 L-11 25.4 Z;
                           M-11 24 L29 24 L57 24 L57 25.4 L28 25.4 L-11 25.4 Z;
                           M-11 24 L29 24 L57 24 L57 25.4 L28 25.4 L-11 25.4 Z;
                           M12 36 L25 23 L35 23 L35 30 L28 30 L22 36 Z"/>
        </path>
        <path fill="#8577C8" d="M-11 30 L-11 30 L-11 31.4 L-11 31.4 Z">
          <animate attributeName="d" begin=".66s" dur="1.53s" fill="freeze" calcMode="spline"
                   keyTimes="0;.19;.45;1" keySplines=".22 .72 .2 1;0 0 1 1;.50 0 .18 1"
                   values="M-11 30 L-11 30 L-11 31.4 L-11 31.4 Z; M-11 30 L35 30 L35 31.4 L-11 31.4 Z;
                           M-11 30 L35 30 L35 31.4 L-11 31.4 Z; M12 36 L19 29 L19 36 L12 36 Z"/>
        </path>
      </g>
    </g>
  </g>
  <g id="still">
    <use xlink:href="#mark" transform="translate(737 540) scale(4.2) translate(-24 -24)"/>
    <use xlink:href="#name" transform="translate(837 0)"/>
  </g>
</svg>
