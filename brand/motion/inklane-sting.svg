<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" aria-labelledby="title description" role="img">
  <title id="title">Inklane</title>
  <desc id="description">Two violet surfaces turn around a shared fold. The view pulls back to reveal the Inklane mark and wordmark.</desc>
  <style>
    .word { font: 650 30px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -1.15px; fill: #262337 }
    #still { display: none }
    @media (prefers-reduced-motion: reduce) { #film { display: none } #still { display: inline } }
  </style>
  <defs>
    <!-- The five resting contours and their inks are the desktop master. -->
    <linearGradient id="folio" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#36315D"/><stop offset="1" stop-color="#211F39"/>
    </linearGradient>
    <path id="sheet" d="M11 3h19q1.2 0 2.1.9l9 9q.9.9.9 2.1v23a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6Z"/>
    <path id="corner" d="M30 3q1.2 0 2.1.9l9 9q.9.9.9 2.1h-7a5 5 0 0 1-5-5Z"/>
    <path id="margin" d="M12 12h7v17l-7 7Z"/>
    <path id="lane" d="m12 36 13-13h10v7h-7l-6 6Z"/>
    <path id="crease" d="m12 36 7-7v7Z"/>
    <g id="master">
      <use xlink:href="#sheet" fill="url(#folio)" stroke="#5D5681" stroke-width=".7"/>
      <use xlink:href="#corner" fill="#8075C1"/><use xlink:href="#margin" fill="#E1DBFF"/>
      <use xlink:href="#lane" fill="#B3A1FF"/><use xlink:href="#crease" fill="#8577C8"/>
    </g>
    <text id="name" class="word" x="49" y="34.2">Inklane</text>
    <clipPath id="sheet-clip"><use xlink:href="#sheet"/></clipPath>
    <clipPath id="letter-mask">
      <path d="M37 6L39 6L27 42L25 42Z">
        <animate attributeName="d" begin="1.49s" dur=".86s" calcMode="spline" keySplines=".28 .02 .18 1" fill="freeze"
          from="M37 6L39 6L27 42L25 42Z" to="M37 6L160 6L148 42L25 42Z"/>
      </path>
    </clipPath>
    <linearGradient id="silk" x1="0" y1="1" x2=".58" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#675899"/><stop offset=".44" stop-color="#C3B4EE"/><stop offset=".83" stop-color="#EBE6FA"/><stop offset="1" stop-color="#F3EDFC"/>
    </linearGradient>
    <linearGradient id="underfold" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#514369"/><stop offset=".42" stop-color="#8B71BE"/><stop offset="1" stop-color="#C4AFF4"/>
    </linearGradient>
    <linearGradient id="crease-light" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#F4ECFF"/><stop offset=".52" stop-color="#BDABD9"/><stop offset="1" stop-color="#75659F"/>
    </linearGradient>
    <filter id="penumbra" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation=".42"/>
    </filter>
    <linearGradient id="surface-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#695185"/><stop offset="1" stop-color="#29233E"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#F6F4F0"/>
  <svg id="film" width="1920" height="1080" viewBox="12 24 18 10.125">
    <!-- Camera keys are in the master mark's 48-unit drawing space. -->
    <animate attributeName="viewBox" dur="2.54s" fill="freeze" calcMode="linear"
      values="12 24 18 10.125;
              11.995 23.994 18.015 10.133;
              11.964 23.957 18.114 10.189;
              11.884 23.86 18.369 10.332;
              11.736 23.682 18.841 10.598;
              11.501 23.401 19.591 11.02;
              11.16 22.999 20.68 11.633;
              10.691 22.453 22.178 12.475;
              10.067 21.74 24.167 13.594;
              9.258 20.833 26.749 15.046;
              8.226 19.699 30.045 16.9;
              6.923 18.298 34.203 19.239;
              5.295 16.586 39.396 22.16;
              3.282 14.509 45.822 25.775;
              0.814 12.011 53.699 30.206;
              -2.18 9.032 63.253 35.58;
              -5.767 5.516 74.699 42.018;
              -10.003 1.417 88.218 49.622;
              -14.921 -3.289 103.913 58.451;
              -20.519 -8.596 121.775 68.499;
              -26.743 -14.452 141.638 79.672;
              -33.481 -20.752 163.142 91.768;
              -40.556 -27.333 185.72 104.467;
              -47.728 -33.977 208.606 117.341;
              -54.711 -40.425 230.891 129.876;
              -61.201 -46.403 251.602 141.526;
              -66.91 -51.653 269.823 151.775;
              -71.609 -55.967 284.819 160.211;
              -75.162 -59.225 296.155 166.587;
              -77.55 -61.414 303.777 170.875;
              -78.889 -62.64 308.049 173.278;
              -79.42 -63.126 309.743 174.231;
              -79.5 -63.2 310 174.375"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12 17 31;-9 17 31;3 17 31;0 17 31" dur="1.78s"
        keyTimes="0;.4;.76;1" calcMode="spline" keySplines=".35 .1 .65 .95;.4 0 .48 1;.3 .03 .2 1" fill="freeze"/>
      <g id="unfold">
        <set attributeName="visibility" to="hidden" begin="1.84s" fill="freeze"/>
      <use xlink:href="#sheet" fill="url(#folio)" stroke="#5D5681" stroke-width=".7"/>
      <g clip-path="url(#sheet-clip)">
        <use xlink:href="#sheet" fill="url(#surface-light)">
          <animate attributeName="opacity" values=".8;.8;0" keyTimes="0;.62;1" dur="1.78s" fill="freeze"/>
        </use>
        <use xlink:href="#corner" fill="#8075C1"/>
        <!-- The lower ribbon crosses the frame on the same 45 degree seam as the margin. -->
        <g fill="url(#underfold)">
          <path id="lower-plane" d="M12 36 25 23H54v7H28l-6 6Z">
          <animate attributeName="d" begin=".65s" dur=".99s" fill="freeze" calcMode="spline" keySplines=".45 .01 .28 1"
            from="M12 36 25 23H54v7H28l-6 6Z" to="M12 36 25 23H35v7H28l-6 6Z"/>
          </path>
        </g>
        <use xlink:href="#lower-plane" fill="#B3A1FF" opacity="0">
          <animate attributeName="opacity" begin=".93s" dur=".78s" from="0" to="1" fill="freeze"/>
        </use>
        <!-- The upper plane rotates around the diagonal from 12,36 to 19,29.
             At the middle key it is edge-on. Its cast shadow closes against the seam. -->
        <path fill="#161124" filter="url(#penumbra)" opacity=".30" d="M35.6 38.1 35.9 30.8 19 29 12 36Z">
          <animate attributeName="d" values="M35.6 38.1 35.9 30.8 19 29 12 36Z;M31 39.3 31.2 31 19 29 12 36Z;M25.4 29.6 27.9 23.6 19 29 12 36Z;M12 12 19 12 19 29 12 36Z"
            keyTimes="0;.31;.68;1" dur="1.28s" calcMode="spline" keySplines=".3 .02 .63 .98;.42 .01 .69 .98;.30 .04 .21 1" fill="freeze"/>
          <animate attributeName="opacity" values=".30;.42;0" keyTimes="0;.56;1" dur="1.32s" fill="freeze"/>
        </path>
        <g id="turn" fill="#E1DBFF">
          <path id="turning-plane" d="M35.7 35.7 35.8 28.8 19 29 12 36Z">
            <animate id="hinge" attributeName="d" dur="1.26s" fill="freeze"
              values="M35.7 35.7 35.8 28.8 19 29 12 36Z;M32.8 32.8 33.7 26.7 19 29 12 36Z;M23.9 23.9 27.43 20.43 19 29 12 36Z;M15.8 15.8 21.69 14.69 19 29 12 36Z;M12 12 19 12 19 29 12 36Z"
              keyTimes="0;.27;.49;.71;1" calcMode="spline" keySplines=".33 0 .7 .67;.34 .23 .72 .72;.33 .32 .67 .87;.26 .29 .22 1"/>
          </path>
          <use xlink:href="#turning-plane" fill="url(#silk)" style="fill:url(#silk)" opacity=".84">
            <animate attributeName="opacity" dur="1.33s" values=".9;.94;.55;0" keyTimes="0;.46;.72;1" fill="freeze"/>
          </use>
          <!-- A narrow cut edge catches light near the apex before it goes flush. -->
          <path d="M35.7 35.7 35.8 28.8" fill="none" stroke="#F7EBFF" stroke-width=".12" opacity=".77">
            <animate attributeName="d" dur="1.26s" fill="freeze"
              values="M35.7 35.7 35.8 28.8;M32.8 32.8 33.7 26.7;M23.9 23.9 27.43 20.43;M15.8 15.8 21.69 14.69;M12 12 19 12"
              keyTimes="0;.27;.49;.71;1" calcMode="spline" keySplines=".33 0 .7 .67;.34 .23 .72 .72;.33 .32 .67 .87;.26 .29 .22 1"/>
            <animate attributeName="opacity" dur="1.27s" values=".81;.98;0" keyTimes="0;.52;1" fill="freeze"/>
          </path>
        </g>
        <use xlink:href="#crease" fill="#8577C8"/>
        <use xlink:href="#crease" fill="url(#crease-light)" opacity=".84">
          <animate attributeName="opacity" dur="1.36s" values=".84;.47;0" keyTimes="0;.55;1" fill="freeze"/>
        </use>
      </g>
      </g>
      <use xlink:href="#master" visibility="hidden">
        <set attributeName="visibility" to="visible" begin="1.84s" fill="freeze"/>
      </use>
    </g>
    <g clip-path="url(#letter-mask)">
      <g><animateTransform attributeName="transform" type="translate" begin="1.48s" dur=".86s" from="-4 0" to="0 0" calcMode="spline" keySplines=".35 .01 .20 1" fill="freeze"/>
        <use xlink:href="#name"/>
      </g>
    </g>
  </svg>
  <svg id="still" width="1920" height="1080" viewBox="-79.5 -63.2 310 174.375">
    <use xlink:href="#master"/><use xlink:href="#name"/>
  </svg>
</svg>
