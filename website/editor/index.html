<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self' blob: data:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Inklane · Workspace</title>
    <link rel="icon" href="icons/app-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="../assets/inklane-app.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="rich-lib/katex.css" />
    <link rel="stylesheet" href="rich-text.css" />
    <script type="module" src="editor.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="../" aria-label="Inklane">
        <picture>
          <source media="(max-width: 660px) and (prefers-color-scheme: dark)" srcset="../assets/inklane-symbol-dark.svg" />
          <source media="(max-width: 660px)" srcset="../assets/inklane-symbol-light.svg" />
          <source media="(prefers-color-scheme: dark)" srcset="../assets/inklane-lockup-dark.svg" />
          <img src="../assets/inklane-lockup-light.svg" alt="" width="124" height="32" />
        </picture>
      </a>
      <div id="document">
        <strong id="name" data-i="workspace">Workspace</strong
        ><small id="state" data-i="browser">Browser edition</small>
      </div>
      <div class="file-actions">
        <button id="open" data-i="open">Open</button>
        <button class="primary" id="save" disabled data-label="save">
          <span class="wide" data-i="save">Save annotations</span
          ><span class="compact" data-i="saveShort">Save</span>
        </button>
        <details id="more">
          <summary aria-label="More actions" data-label="more">
            <svg viewBox="0 0 24 24"><path d="M4 12h1m6.5 0h1m6.5 0h1" /></svg>
          </summary>
          <div class="menu">
            <button id="home" data-i="home">Documents</button
            ><button id="new-sheet" data-i="create">New notebook</button>
            <button id="rename-book" hidden data-i="rename"></button
            ><button id="index" disabled data-i="index">
              Browse annotations</button
            ><button id="download" disabled data-i="download">
              Download annotation copy</button
            ><button id="feedback" disabled data-i="feedback">
              Export feedback…</button
            ><button id="portable" disabled data-i="portable">
              Save portable copy…</button
            ><button id="whole-page" disabled data-i="fitPage"></button
            ><button id="print" disabled data-i="print">Print review…</button>
            <button
              id="continuous-view"
              disabled
              data-i="continuousView"
              aria-pressed="false"
            ></button>
            <button id="export-image" disabled data-i="exportImage"></button>
            <button id="shortcuts" data-i="guide">
              How to use the workspace</button
            ><button id="language"></button>
          </div>
        </details>
      </div>
    </header>
    <main id="work">
      <section id="welcome">
        <div class="welcome-lead">
          <span class="library-mark" aria-hidden="true"
            ><svg viewBox="0 0 48 48">
              <path d="M8 12h24v27H8zM15 6h24v27M14 21h11m-11 5h7" /></svg
          ></span>
          <h1 data-i="home">Documents</h1>
          <p data-i="intro">
            Open a document to review, or start on fresh paper.
          </p>
        </div>
        <div class="launch-grid">
          <button id="start" class="launch">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 18V5h7l3 3h8v3M3 18l3-8h16l-3 9H3z" /></svg
            ><strong data-i="choose">Open document</strong
            ><small data-i="supported">PDF, PNG, JPEG or Inklane</small>
          </button>
          <button id="new-notebook" class="launch">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 4h14v16H5zM8 4v16m3-9h5m-2.5-2.5v5" /></svg
            ><strong data-i="create">New notebook</strong
            ><small data-i="paperTypes">Blank, ruled or squared paper</small>
          </button>
        </div>
        <section id="recent" hidden>
          <h2 data-i="recent">On this device</h2>
          <div id="draft-list"></div>
        </section>
        <button id="sample-link" class="sample-link" data-i="openSample">
          Open the field guide
        </button>
      </section>
      <div
        id="tools"
        class="tools"
        role="group"
        data-label="tools"
        hidden
      ></div>
      <section id="viewport" tabindex="0" data-label="surface" hidden>
        <div id="mat">
          <div id="sheet">
            <canvas id="source" aria-hidden="true"></canvas>
            <div id="pictures"></div>
            <div id="marks" aria-hidden="true"></div>
            <div id="objects"></div>
          </div>
        </div>
      </section>
      <aside id="card" hidden>
        <div class="card-head">
          <span id="badge"></span
          ><input
            id="note-title"
            maxlength="200"
            data-label="title"
            autocomplete="off"
          /><button id="close-card" data-label="collapse" class="icon">
            ⌃
          </button>
        </div>
        <div class="note-modes">
          <button id="note-edit" data-i="edit" aria-pressed="true"></button
          ><button
            id="note-read"
            data-i="preview"
            aria-pressed="false"
          ></button>
        </div>
        <div id="note-preview" hidden></div>
        <button id="note-resize" data-label="resize">◢</button>
        <textarea
          id="note-body"
          maxlength="1000000"
          data-label="noteBody"
        ></textarea>
      </aside>
      <div id="message" role="status" hidden></div>
    </main>
    <footer hidden>
      <div id="pen-properties">
        <input
          type="color"
          id="ink-color"
          value="#6447b0"
          data-label="inkColor"
        /><select id="ink-size" data-label="inkSize">
          <option value="1.5">1.5 px</option>
          <option value="3" selected>3 px</option>
          <option value="5">5 px</option>
        </select>
      </div>
      <div id="pages" hidden>
        <button id="prev-page" class="icon" data-label="prev">‹</button
        ><button id="page-count" data-label="goto">1 / 1</button
        ><button id="next-page" class="icon" data-label="next">›</button
        ><button id="add-page" class="icon" data-label="addPage">+</button>
      </div>
      <span id="hint"></span>
      <div class="actions">
        <button id="edit" data-i="edit" hidden>Edit</button
        ><button id="duplicate" data-i="duplicate" hidden>Duplicate</button
        ><button id="remove" data-i="remove" hidden>Delete</button>
        <button id="undo" class="icon" data-label="undo">↶</button
        ><button id="redo" class="icon" data-label="redo">↷</button>
      </div>
      <button id="keep-sample" data-i="keep">Keep a copy</button>
      <div class="zoom">
        <button id="minus" class="icon" data-label="out">−</button
        ><button id="fit" data-label="fit">100%</button
        ><button id="plus" class="icon" data-label="in">+</button>
      </div>
    </footer>
    <input
      id="files"
      type="file"
      accept=".png,.jpg,.jpeg,.pdf,.json,.inklane"
      multiple
      hidden
    />
    <dialog id="new-document" aria-labelledby="new-heading">
      <form id="paper-form">
        <h2 id="new-heading" data-i="create"></h2>
        <label
          ><span data-i="notebookName"></span
          ><input id="book-title" maxlength="160" required autocomplete="off"
        /></label>
        <div class="form-row">
          <label
            ><span data-i="sizeLabel"></span
            ><select id="paper-size">
              <option>A4</option>
              <option>A5</option>
            </select></label
          >
          <label
            ><span data-i="orientation"></span
            ><select id="orientation">
              <option value="portrait" data-i="portrait"></option>
              <option value="landscape" data-i="landscape"></option></select
          ></label>
        </div>
        <label
          ><span data-i="paper"></span
          ><select id="pattern">
            <option value="Blank" data-i="blank"></option>
            <option value="Ruled" data-i="ruled"></option>
            <option value="Squared" data-i="squared"></option></select
        ></label>
        <label id="spacing-row" hidden
          ><span data-i="spacing"></span
          ><select id="spacing">
            <option value="5">5 mm</option>
            <option value="10">10 mm</option>
            <option value="custom" data-i="custom"></option></select
        ></label>
        <label id="custom-spacing-row" hidden
          ><span data-i="customSpacing"></span
          ><input
            id="custom-spacing"
            type="number"
            min="1"
            max="100"
            step="any"
            value="7"
        /></label>
        <div class="relink-actions">
          <button type="button" id="cancel-new" data-i="cancel"></button
          ><button class="primary" data-i="createBook"></button>
        </div>
      </form>
    </dialog>
    <dialog id="page-list" aria-labelledby="pages-heading">
      <div class="dialog-top">
        <h2 id="pages-heading" data-i="pages"></h2>
        <form method="dialog">
          <button class="icon" data-label="done">×</button>
        </form>
      </div>
      <div id="page-choices"></div>
      <div id="page-manage" hidden>
        <button data-page-action="back" data-i="moveBack"></button
        ><button data-page-action="forward" data-i="moveForward"></button
        ><button data-page-action="copy" data-i="copyPage"></button
        ><button data-page-action="remove" data-i="deletePage"></button>
      </div>
    </dialog>
    <dialog id="rename" aria-labelledby="rename-heading">
      <form id="rename-form">
        <h2 id="rename-heading" data-i="rename"></h2>
        <label for="rename-title" data-i="notebookName"></label
        ><input id="rename-title" maxlength="160" required />
        <div class="relink-actions">
          <button type="button" id="cancel-rename" data-i="cancel"></button
          ><button class="primary" data-i="done"></button>
        </div>
      </form>
    </dialog>
    <dialog id="print-options" aria-labelledby="print-heading">
      <form id="print-form">
        <h2 id="print-heading" data-i="printTitle"></h2>
        <label for="print-range" data-i="pages"></label>
        <select id="print-range">
          <option id="print-all" value="all"></option>
          <option id="print-current" value="current"></option>
        </select>
        <p id="print-limit" hidden data-i="printLimit"></p>
        <div class="relink-actions">
          <button type="button" id="cancel-print" data-i="cancel"></button
          ><button
            type="submit"
            class="primary"
            data-i="continuePrint"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="picture-size">
      <form id="size-form">
        <h2 data-i="resize"></h2>
        <label for="picture-width" data-i="pictureWidth"></label
        ><input
          id="picture-width"
          type="number"
          min="1"
          step="any"
          required
        /><small id="picture-height"></small>
        <div class="relink-actions">
          <button id="cancel-size" type="button" data-i="cancel"></button
          ><button class="primary" data-i="done"></button>
        </div>
      </form>
    </dialog>
    <dialog id="browse">
      <div class="dialog-top">
        <h2 data-i="index"></h2>
        <form method="dialog">
          <button data-label="done" class="icon">×</button>
        </form>
      </div>
      <input id="search" type="search" data-label="search" />
      <div id="results"></div>
    </dialog>
    <dialog id="relink">
      <h2 data-i="relink"></h2>
      <p data-i="relinkHint"></p>
      <p><strong id="source-name" dir="auto"></strong></p>
      <div class="relink-actions">
        <button id="pick-source" class="primary" data-i="choose"></button>
        <form method="dialog"><button data-i="cancel"></button></form>
      </div>
    </dialog>
    <dialog id="help">
      <h2 data-i="guide"></h2>
      <p data-i="helpOpen"></p>
      <p data-i="helpEdit"></p>
      <p data-i="helpSave"></p>
      <form method="dialog">
        <button class="primary" data-i="done">Done</button>
      </form>
    </dialog>
    <noscript
      >Inklane requires JavaScript. Inklane benötigt JavaScript.</noscript
    >
  </body>
</html>
